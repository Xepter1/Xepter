server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA-Fallback: unbekannte Pfade (z. B. /kontakt, /impressum) auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gehashte Build-Assets aggressiv cachen
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # E-Mail-Signatur-Bilder: oeffentlich erreichbar (Mail-Programme muessen sie laden),
    # aber kein Verzeichnis-Listing, von Google ferngehalten, lange gecacht.
    location /email/ {
        autoindex off;                                    # kein Ordner-Listing
        add_header X-Robots-Tag "noindex, noimageindex, nofollow" always;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Gzip für Text-Assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
